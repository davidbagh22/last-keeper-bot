name: Render Health

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render service and verify Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          URL="https://last-keeper-bot.onrender.com/health"
          echo "Checking $URL"
          for i in $(seq 1 30); do
            echo "Attempt $i/30"
            if BODY=$(curl -fsS --max-time 20 "$URL" 2>/tmp/curl-error.txt); then
              echo "$BODY"
              python - "$BODY" <<'PY'
import json, sys
body = json.loads(sys.argv[1])
status = body.get('status')
bot = body.get('bot')
print(f"status={status} bot={bot} webhook={body.get('webhook')}")
if status != 'ok':
    raise SystemExit(f"Render responded but Telegram runtime is not ready: {status!r}; error={body.get('error')!r}")
if not bot:
    raise SystemExit('Render is up, but bot username is missing')
PY
              exit 0
            fi
            cat /tmp/curl-error.txt || true
            sleep 15
          done
          echo "Render health endpoint did not become healthy in time"
          exit 1
