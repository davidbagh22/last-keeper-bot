name: Render Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live service
        id: probe
        shell: bash
        run: |
          set +e
          URL="https://last-keeper-bot.onrender.com/health"
          HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' "$URL" 2>/tmp/curl.err)
          CURL_RC=$?
          echo "URL=$URL" > /tmp/report.txt
          echo "HTTP_CODE=$HTTP_CODE" >> /tmp/report.txt
          echo "CURL_RC=$CURL_RC" >> /tmp/report.txt
          echo "--- RESPONSE ---" >> /tmp/report.txt
          cat /tmp/health.json >> /tmp/report.txt 2>/dev/null || true
          echo >> /tmp/report.txt
          echo "--- CURL ERROR ---" >> /tmp/report.txt
          cat /tmp/curl.err >> /tmp/report.txt 2>/dev/null || true
          echo >> /tmp/report.txt
          cat /tmp/report.txt
          if [ "$CURL_RC" -eq 0 ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json && grep -q '"bot"[[:space:]]*:' /tmp/health.json; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish report issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Render Probe ${GITHUB_SHA}" \
            --body-file /tmp/report.txt

      - name: Require healthy runtime
        if: always()
        shell: bash
        run: |
          test "${{ steps.probe.outputs.healthy }}" = "true"
