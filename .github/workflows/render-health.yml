name: Render Wake And Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  wake-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repeatedly wake Render and verify Telegram runtime
        id: probe
        shell: bash
        run: |
          set +e
          URL="https://last-keeper-bot.onrender.com/health"
          : > /tmp/report.txt
          echo "URL=$URL" >> /tmp/report.txt
          echo "Started=$(date -u +%FT%TZ)" >> /tmp/report.txt
          HEALTHY=false

          for i in 1 2 3 4 5 6; do
            echo "" >> /tmp/report.txt
            echo "=== ATTEMPT $i/6 ===" >> /tmp/report.txt
            HTTP_CODE=$(curl -sS --max-time 25 -o /tmp/health.json -w '%{http_code}' "$URL" 2>/tmp/curl.err)
            CURL_RC=$?
            echo "HTTP_CODE=$HTTP_CODE" >> /tmp/report.txt
            echo "CURL_RC=$CURL_RC" >> /tmp/report.txt
            if [ -s /tmp/health.json ]; then
              echo "RESPONSE:" >> /tmp/report.txt
              cat /tmp/health.json >> /tmp/report.txt
              echo >> /tmp/report.txt
            fi
            if [ -s /tmp/curl.err ]; then
              echo "CURL_ERROR:" >> /tmp/report.txt
              cat /tmp/curl.err >> /tmp/report.txt
              echo >> /tmp/report.txt
            fi

            if [ "$CURL_RC" -eq 0 ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json 2>/dev/null && grep -q '"bot"[[:space:]]*:' /tmp/health.json 2>/dev/null; then
              HEALTHY=true
              echo "RESULT=HEALTHY" >> /tmp/report.txt
              break
            fi
            rm -f /tmp/health.json /tmp/curl.err
            sleep 5
          done

          echo "" >> /tmp/report.txt
          echo "Finished=$(date -u +%FT%TZ)" >> /tmp/report.txt
          echo "HEALTHY=$HEALTHY" >> /tmp/report.txt
          cat /tmp/report.txt
          echo "healthy=$HEALTHY" >> "$GITHUB_OUTPUT"

      - name: Publish diagnostic to issue 13
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue edit 13 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Render runtime diagnostic" \
            --body-file /tmp/report.txt

      - name: Require healthy runtime
        if: always()
        shell: bash
        run: |
          test "${{ steps.probe.outputs.healthy }}" = "true"
