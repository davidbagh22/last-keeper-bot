name: Render Health

on:
  push:
    branches: [main]
    paths-ignore:
      - runtime_status.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-health-main
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Render and Telegram runtime
        shell: bash
        run: |
          set +e
          URL="https://last-keeper-bot.onrender.com/health"
          BODY=""
          ERROR=""
          OK="false"
          ATTEMPT=0

          for i in 1 2 3; do
            ATTEMPT="$i"
            echo "Attempt $i/3: $URL"
            BODY=$(curl -fsS --max-time 15 "$URL" 2>/tmp/curl-error.txt)
            CURL_RC=$?
            if [ "$CURL_RC" -eq 0 ]; then
              echo "$BODY"
              python - "$BODY" <<'PY'
import json, sys
body = json.loads(sys.argv[1])
print(f"status={body.get('status')} bot={body.get('bot')} webhook={body.get('webhook')}")
raise SystemExit(0 if body.get('status') == 'ok' and body.get('bot') else 1)
PY
              if [ "$?" -eq 0 ]; then
                OK="true"
                break
              fi
              ERROR="Render responded, but Telegram runtime is not ready"
            else
              ERROR=$(cat /tmp/curl-error.txt 2>/dev/null || true)
              echo "$ERROR"
            fi
            sleep 5
          done

          export URL BODY ERROR OK ATTEMPT
          python - <<'PY'
import json, os
raw = os.environ.get('BODY', '')
try:
    parsed = json.loads(raw) if raw else None
except Exception:
    parsed = raw
payload = {
    'url': os.environ.get('URL'),
    'healthy': os.environ.get('OK') == 'true',
    'attempt': int(os.environ.get('ATTEMPT') or 0),
    'response': parsed,
    'error': os.environ.get('ERROR') or None,
}
with open('runtime_status.json', 'w', encoding='utf-8') as f:
    json.dump(payload, f, ensure_ascii=False, indent=2)
print(json.dumps(payload, ensure_ascii=False, indent=2))
PY
          echo "HEALTH_OK=$OK" >> "$GITHUB_ENV"

      - name: Publish runtime status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_status.json
          git commit -m "Update Render runtime status [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require healthy runtime
        if: always()
        shell: bash
        run: |
          test "${HEALTH_OK:-false}" = "true"
