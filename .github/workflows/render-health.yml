name: Render Health Status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live Render service
        id: probe
        shell: bash
        run: |
          set +e
          URL="https://last-keeper-bot.onrender.com/health"
          HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' "$URL" 2>/tmp/curl.err)
          CURL_RC=$?

          STATE="failure"
          DESC="render unreachable"

          if [ "$CURL_RC" -eq 0 ] && [ -s /tmp/health.json ]; then
            RESULT=$(python - <<'PY'
import json
from pathlib import Path
try:
    data = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
    status = data.get('status')
    bot = data.get('bot') or '-'
    err = data.get('error') or '-'
    ok = status == 'ok' and bot != '-'
    desc = f"status={status} bot={bot} http=OK"
    if not ok and err != '-':
        desc += f" err={err}"
    print(('success' if ok else 'failure') + '|' + desc[:130])
except Exception as exc:
    print('failure|invalid health JSON: ' + str(exc)[:100])
PY
)
            STATE="${RESULT%%|*}"
            DESC="${RESULT#*|}"
          else
            ERR=$(tr '\n' ' ' < /tmp/curl.err 2>/dev/null | cut -c1-80)
            DESC="curl=${CURL_RC} http=${HTTP_CODE} ${ERR}"
          fi

          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESC" >> "$GITHUB_OUTPUT"
          echo "Probe result: $STATE | $DESC"

      - name: Publish readable commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.probe.outputs.state }}
          DESC: ${{ steps.probe.outputs.description }}
        shell: bash
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${STATE:-failure}" \
            -f context="render-health" \
            -f description="${DESC:-probe failed before producing output}"

      - name: Require healthy runtime
        if: always()
        shell: bash
        run: |
          test "${{ steps.probe.outputs.state }}" = "success"
